# Per-project pipeline configuration.
#
# One copy of this file lives in each project repository. The Jenkinsfile is
# identical across projects; everything project-specific belongs here.
#
# Format: KEY=VALUE, one per line. Lines starting with # are ignored.
# Every key found here is exported as an environment variable, so adding a new
# setting needs no Jenkinsfile change.
#
# See VARIABLES.md for what each key does.

# Flutter SDK version, installed and pinned by FVM.
FLUTTER_VERSION=3.35.4

# Shorebird auth token, held in Jenkins Credentials as "Secret text".
# Only the credential ID belongs here, never the token itself: this file is
# committed to the repo, and the pipeline prints every key it loads.
SHOREBIRD_TOKEN_CREDENTIALS_ID=shorebird-token
