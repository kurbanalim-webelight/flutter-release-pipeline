# Per-project pipeline configuration.
#
# Format: KEY=VALUE, one per line. Lines starting with # are ignored.
# See VARIABLES.md for what each key does.

# Flutter SDK version, installed and pinned by FVM.
FLUTTER_VERSION=3.44.6

# How to reach GitLab: ssh or https.
# ssh needs port 22 open to the host; https works through a normal HTTPS path.
GIT_PROTOCOL=https

# GitLab host. Same for every project on this server.
GIT_HOST=gitlab.webelight.co.in

# Group and project path, without the leading slash and without ".git".
GIT_REPO_PATH=webelight/ccmt/chinmaya-mission-flutter

# Branch to clone.
GIT_BRANCH=main

# Jenkins credential for GitLab. Must match GIT_PROTOCOL:
#   ssh   -> Kind: SSH Username with private key   (username: git)
#   https -> Kind: Username with password          (username: oauth2, password: token)
GIT_CREDENTIALS_ID=gitlab-token

# Shorebird auth token, held in Jenkins Credentials as "Secret text".
SHOREBIRD_TOKEN_CREDENTIALS_ID=shorebird-token
