# Per-project pipeline configuration.
#
# Format: KEY=VALUE, one per line. Lines starting with # are ignored.
# See VARIABLES.md for what each key does.

# Flutter SDK version, installed and pinned by FVM.
FLUTTER_VERSION=3.44.6

# How to reach GitLab: ssh or https.
# ssh needs port 22 open to the host; https works through a normal HTTPS path.
GIT_PROTOCOL=https

# GitLab host. Same for every project on this server.
GIT_HOST=gitlab.webelight.co.in

# Group and project path, without the leading slash and without ".git".
GIT_REPO_PATH=webelight/ccmt/chinmaya-mission-flutter

# Branch to clone.
GIT_BRANCH=main

# Jenkins credential for GitLab. Must match GIT_PROTOCOL:
#   ssh   -> Kind: SSH Username with private key   (username: git)
#   https -> Kind: Username with password          (username: oauth2, password: token)
GIT_CREDENTIALS_ID=gitlab-token

# Infisical, used to generate the .env file in the project root.
INFISICAL_API_URL=https://app.infisical.com
INFISICAL_PROJECT_ID=ebac93cc-186d-464b-85fb-d66c5fd5e6e6
INFISICAL_ENV=prod

# Jenkins credential holding the Infisical token.
# Kind: Secret text
INFISICAL_TOKEN_CREDENTIALS_ID=infisical-token

# Shorebird auth token, held in Jenkins Credentials as "Secret text".
SHOREBIRD_TOKEN_CREDENTIALS_ID=shorebird-token

# Object storage holding the secret files. Any S3-compatible service works:
# AWS S3, Cloudflare R2, MinIO, Backblaze B2, DigitalOcean Spaces.
#
# The endpoint is the API address of that service, for example:
#   AWS S3        https://s3.ap-south-1.amazonaws.com
#   Cloudflare R2 https://<account-id>.r2.cloudflarestorage.com
#   MinIO         https://minio.example.com:9000
S3_ENDPOINT=https://e41659b190ae1208589a21e5cb9115e0.r2.cloudflarestorage.com

# Region the bucket lives in. Services without regions use a fixed value:
# "auto" for Cloudflare R2, "us-east-1" for most MinIO setups.
S3_REGION=auto

# Jenkins credential holding the storage keys.
#   Kind:     Username with password
#   Username: Access Key ID
#   Password: Secret Access Key
S3_CREDENTIALS_ID=r2-credentials

# Secret files pulled from that storage before the build.
# Format: SECRET_FILE.<path in the project>=<s3 uri>
# Left side is where the file lands, right side is where it comes from.
SECRET_FILE.android/app/src/prod/google-services.json=s3://com-chinmayamission-app/google-services.json
SECRET_FILE.android/key.properties=s3://com-chinmayamission-app/key.properties
SECRET_FILE.android/cm-app.jks=s3://com-chinmayamission-app/cm-app.jks

SECRET_FILE.ios/Firebase/prod/GoogleService-Info.plist=s3://com-chinmayamission-app/GoogleService-Info.plist
SECRET_FILE.ios/Flutter/Secrets.xcconfig=s3://com-chinmayamission-app/Secrets.xcconfig

SECRET_FILE.shorebird.yaml=s3://com-chinmayamission-app/shorebird.yaml

# Google Play service account, used to upload the .aab to the internal testing
# track at the end of every Android build. The package name is not a secret; it has
# to match the application id Play lists the app under, exactly.
# The JSON key is the secret and comes down as a SECRET_FILE like the Apple .p8;
# keep the generic name below so a rotated key changes nothing here.
ANDROID_PACKAGE_NAME=com.chinmayamission.app
SECRET_FILE.private_keys/play-store.json=s3://com-chinmayamission-app/google_service_account.json

# App Store Connect API key, used to upload the .ipa to TestFlight at the end of
# every iOS build. Both are identifiers, not secrets.
# The .p8 is the secret and comes down as a SECRET_FILE like any other; keep the
# generic name below - the upload stage copies it to the AuthKey_<ASC_KEY_ID>.p8
# name Apple insists on, so a rotated key only changes ASC_KEY_ID here.
ASC_KEY_ID=7UB3848ZB4
ASC_ISSUER_ID=69a6de93-1988-47e3-e053-5b8c7c11a4d1
SECRET_FILE.private_keys/AuthKey.p8=s3://com-chinmayamission-app/AuthKey.p8
